# Source-of-truth for the catalog library versions.
#
# Build once to download the pinned libraries into ~/.arduino15/internal:
#   arduino-cli compile --profile host generator/font_catalog_probe
profiles:
  host:
    fqbn: lang-ship:host:host:mode=lgfx
    platforms:
      - platform: lang-ship:host (1.3.1)
        platform_index_url: https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
    libraries:
      - LovyanGFX (1.2.21)
      - M5GFX (0.2.22)

default_profile: host
