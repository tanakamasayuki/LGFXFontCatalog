name: Generate catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "generator/**"
      - ".github/workflows/generate.yml"

permissions:
  contents: write

jobs:
  generate:
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: python -m pip install -r generator/requirements.txt
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y binutils libsdl2-dev
      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.4.0
      - name: Download pinned Arduino libraries
        run: arduino-cli compile --profile host generator/download_lgfx
      - name: Generate metadata and harness table
        run: python generator/generate.py --write-table
      - name: Run host harness
        run: python -m pytest generator/font_catalog_probe/font_catalog_probe.py
      - name: Generate site
        run: python generator/generate.py --use-probe-output
      - name: Commit generated docs
        run: |
          if git diff --quiet -- docs generator/font_catalog_probe/fonts_table.h; then
            echo "no generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs generator/font_catalog_probe/fonts_table.h
          git commit -m "chore: regenerate catalog [skip ci]"
          git push
